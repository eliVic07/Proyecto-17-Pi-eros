<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreador de tareas</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <main class="caja">
    <h1>¿Qué tarea realizaras hoy?</h1>

    <form id="formulario" class="formulario">
      <input type="text" id="nueva-tarea" placeholder="Escribe lo que te propones..." autocomplete="off">
      <button type="submit" class="agregar">Agregar</button>
    </form>

    <ul id="lista"></ul>
  </main>

  <script src="js.js"></script>
</body>
</html>
